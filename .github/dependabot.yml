version: 2
updates:
  - package-ecosystem: nuget
    # The root solution and Directory.Packages.props cover all Windows projects and lockfiles.
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
