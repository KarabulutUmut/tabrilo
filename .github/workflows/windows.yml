name: Windows CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Windows build and processing tests
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore verified tools
        id: tools
        shell: pwsh
        run: ./scripts/restore-tools.ps1 -Validation
      - name: Validate manifests and workflows
        id: manifests
        shell: pwsh
        run: ./scripts/check-manifests.ps1
      - name: Check docs, build, and run processing and security tests
        id: tests
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release
      - name: Record failure summary
        if: failure()
        shell: pwsh
        env:
          TOOL_RESTORE: ${{ steps.tools.outcome }}
          MANIFEST_CHECK: ${{ steps.manifests.outcome }}
          BUILD_AND_TEST: ${{ steps.tests.outcome }}
        run: |
          @(
            "commit=$env:GITHUB_SHA"
            "tool-restore=$env:TOOL_RESTORE"
            "manifest-check=$env:MANIFEST_CHECK"
            "build-and-test=$env:BUILD_AND_TEST"
          ) | Set-Content -LiteralPath "$env:RUNNER_TEMP/tabrilo-test-status.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: windows-test-failure
          path: ${{ runner.temp }}/tabrilo-test-status.txt
          retention-days: 14
          if-no-files-found: error

  package:
    name: Unsigned Windows development package self-check
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore verified tools
        shell: pwsh
        run: ./scripts/restore-tools.ps1
      - name: Build and check the unsigned self-contained payload
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Configuration Release -PayloadOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = Get-ChildItem -LiteralPath 'artifacts/package/local' -Recurse -Filter 'Tabrilo.exe' -File
          if (@($app).Count -ne 1) { throw 'Expected one packaged application.' }
          & (Join-Path $app.DirectoryName 'tools/qpdf/qpdf.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $process = Start-Process -FilePath $app.FullName -ArgumentList '--self-check' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          'Unsigned development/test payload passed its self-check. Desktop UI and installation require separate tests.' >> $env:GITHUB_STEP_SUMMARY
          # Keep the payload on the runner pending redistribution review.
